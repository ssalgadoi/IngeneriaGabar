{% load static %}
<!DOCTYPE html>
<html lang="es">

    <head>
        <!-- Swiper CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

        <!-- Swiper JS -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
        <!-- Icono Web -->
        <link rel="icon" href="{% static 'img/icon.webp' %}" type="image/x-icon">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
        <title>{% block title %}{% endblock %} | Ingenería Gabar</title>
        <link rel="stylesheet" href="{% static 'css/navegador.css' %}">
        <link rel="stylesheet" href="{% static 'css/index.css' %}">
        <link rel="stylesheet" href="{% static 'css/services.css' %}">



    </head>

    <body>
        <nav class="layout__nav">
            <div class="layout__logo">
                <a href="{% url 'index' %}" class="logo d-flex align-items-center navbar-brand">
                    <img class="image" src="{% static 'img/Logo.webp' %}" alt="Logo">
                </a>

            </div>
            <ul class="layout__ul" id="menuList">
                <li class="layout__item"><a class="layout__link" href="{% url 'index' %}#inicio">Inicio</a></li>
                <li class="layout__item"><a class="layout__link" href="{% url 'index' %}#nosotros">Nosotros</a></li>
                <li class="layout__item"><a class="layout__link" href="{% url 'index' %}#servicios">Servicios</a></li>
                <li class="layout__item"><a class="layout__link" href="{% url 'index' %}#contacto">Contacto</a></li>
            </ul>
            <div class="layout__icons">
                <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
            </div>
        </nav>

        {% block content %}
        {% endblock %}

        <footer class="layout__footer">
            
            <p class="layout__year">Ingenería GABAR <span>&copy;</span> <span id="current-year"></span></p>
        </footer>

        <button id="scrollToTopBtn" class="scroll-to-top-btn" onclick="scrollToTop()">
            <i class="fa-solid fa-arrow-up"></i>
        </button>

        
        <script src="{% static 'js/index.js' %}"></script>
    </body>

</html>
